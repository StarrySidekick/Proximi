# Guards the listings file. The weekly scrape commits data/events.json
# unattended, so this catches malformed or out-of-area data before it reaches
# the published site.
name: Validate listings

on:
  push:
    branches: [claude/local-events-discovery-vfjgwr]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check data/events.json
        run: python3 scripts/validate.py

      - name: Check the source registry parses
        run: |
          python3 -c "
          import json
          reg = json.load(open('sources/registry.json'))
          ids = [s['id'] for s in reg['sources']]
          assert len(ids) == len(set(ids)), 'duplicate source ids'
          for s in reg['sources']:
              assert s['kind'] in ('ics', 'html', 'api', 'social'), (s['id'], s['kind'])
              assert s['url'].startswith('http'), s['id']
          print(f'{len(ids)} sources OK')
          "
