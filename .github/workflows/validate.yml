# Guards the listings file AND the page. The weekly scrape commits
# data/events.json unattended, so the validate job catches malformed or
# out-of-area data before it reaches the published site; the browser job
# drives the real app in headless Chromium (tests/drive.js) because a
# refactor once deleted the Places page's tap handlers and no data check
# could ever have noticed.
name: Validate listings

on:
  push:
    branches: [main, claude/local-events-discovery-vfjgwr]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check data/events.json and data/places.json
        run: python3 scripts/validate.py

      - name: Check the place tag rules still match something
        run: python3 scripts/places.py --selftest

      - name: Check the source registry parses
        run: |
          python3 -c "
          import json, sys
          sys.path.insert(0, 'scripts')
          import harvest
          # Read the allowed kinds from the code rather than restating them.
          # This list was hard-coded once and went stale the moment 'sqsp' was
          # added, so the job failed on a registry that was perfectly fine.
          KINDS = set(harvest.HANDLERS) | {'html', 'api', 'social'}
          reg = json.load(open('sources/registry.json'))
          ids = [s['id'] for s in reg['sources']]
          assert len(ids) == len(set(ids)), 'duplicate source ids'
          for s in reg['sources']:
              assert s['kind'] in KINDS, (s['id'], s['kind'], sorted(KINDS))
              assert s['url'].startswith('http'), s['id']
          print(f'{len(ids)} sources OK across kinds {sorted(KINDS)}')
          "

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Drive the app in headless Chromium
        run: node tests/drive.js
