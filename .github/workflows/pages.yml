# Publishes the static site to GitHub Pages.
#
# `configure-pages` with `enablement: true` turns Pages on via the API the first
# time this runs, so the site can go live without anyone touching repo settings.
name: Deploy to GitHub Pages

on:
  push:
    branches: [claude/local-events-discovery-vfjgwr]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate listings
        run: |
          python3 -c "
          import json
          d = json.load(open('data/events.json'))
          items = d['items']
          ids = [i['id'] for i in items]
          assert len(ids) == len(set(ids)), 'duplicate listing ids'
          print(f'{len(items)} listings OK')
          "

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
